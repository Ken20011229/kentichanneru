name: YouTube AutoPoster

on:
  schedule:
    # schedule は GitHub 側の混雑で大きく遅れる（2026-10 実測: 朝は +2〜3.5h、
    # 夜は +3.5〜6.5h）。夜の回が JST 1〜2 時着になり、その時間帯の Shorts は
    # 中央値 約250再生（22〜0時台は 約900）だったので夜を前倒しする。
    # 毎時 0 分は特に混むので半端な分にずらす。
    - cron: '17 22 * * *'  # 07:17 JST（実着は 9〜10 時台）
    - cron: '23 8 * * *'   # 17:23 JST（実着は 21〜0 時台）
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    # 実測の成功実行は 31〜46 分（本編レンダリング 19〜21 分＋Shorts 14 分〜）で、
    # 60 分では遅いランナーを引いたときに完走できず cancelled になっていた
    # （07-29 / 07-31 / 08-02 の 3 回。いずれも Shorts レンダリング中に打ち切り）。
    # 枠を広げてもレンダリングが終われば即終了するので、平均消費時間は変わらない。
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # data/ を前回実行から引き継ぐ（重複排除・チャンネルローテーション等）
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/
          key: autoposter-data-${{ github.run_id }}
          restore-keys: autoposter-data-

      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg p7zip-full

      # 動画レンダリング(zoompan+xfadeの多段filter_complex)がスライド数に応じて
      # メモリを線形以上に消費し、標準ランナー(16GB)を使い切ってOOM相当で
      # ランナーごと強制終了する事象が発生したための緩和策
      - name: Add swap space
        run: |
          free -h
          sudo fallocate -l 8G /swapfile_ci
          sudo chmod 600 /swapfile_ci
          sudo mkswap /swapfile_ci
          sudo swapon /swapfile_ci
          free -h

      - name: Cache VOICEVOX Engine
        id: cache-voicevox
        uses: actions/cache@v4
        with:
          path: voicevox_engine
          key: voicevox-engine-0.25.2-linux-x64

      - name: Download & Extract VOICEVOX Engine
        if: steps.cache-voicevox.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/VOICEVOX/voicevox_engine/releases/download/0.25.2/voicevox_engine-linux-cpu-x64-0.25.2.7z.001" -O voicevox.7z.001
          mkdir -p voicevox_raw
          7z x voicevox.7z.001 -o./voicevox_raw/ -y
          rm voicevox.7z.001
          # run バイナリのある最上位ディレクトリを voicevox_engine/ に移動
          RUN_PATH=$(find voicevox_raw -name "run" -type f | head -1)
          ENGINE_DIR=$(dirname "$RUN_PATH")
          mv "$ENGINE_DIR" voicevox_engine
          rm -rf voicevox_raw

      - name: Start VOICEVOX Engine
        run: |
          chmod +x voicevox_engine/run
          ./voicevox_engine/run --host 127.0.0.1 --port 50021 &
          echo "Waiting for VOICEVOX to start..."
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:50021/version > /dev/null 2>&1; then
              echo "VOICEVOX ready: $(curl -s http://127.0.0.1:50021/version)"
              break
            fi
            sleep 2
          done

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup YouTube credentials
        env:
          CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          mkdir -p config/credentials
          printenv CLIENT_SECRETS > config/credentials/client_secrets.json
          printenv TOKEN_JSON     > config/credentials/token.json
          echo "client_secrets.json: $(wc -c < config/credentials/client_secrets.json) bytes"
          echo "token.json:          $(wc -c < config/credentials/token.json) bytes"
          python -c "import json; json.load(open('config/credentials/token.json'))" \
            && echo "token.json: valid JSON" \
            || { echo "ERROR: token.json is empty or invalid — set YOUTUBE_TOKEN secret correctly"; exit 1; }

      # 学習ループ（再生数取得 → evolver が strategy.json のジャンル重みを更新）は
      # ローカルのタスクスケジューラでしか動いておらず、ローカルの video_log には
      # 9本しか無いため、クラウドで投稿した数百本は一度も学習に使われていなかった。
      # 投稿の直前に回して、その回のジャンル選択から反映させる。失敗しても投稿は続ける。
      # config.yaml の ${...} は未設定だと load_config が例外を投げる。
      # このステップは YouTube API しか使わないのでダミー値でよい。
      - name: Update stats & strategy
        continue-on-error: true
        env:
          GROQ_API_KEY: UNUSED
          PEXELS_API_KEY: UNUSED
          GNEWS_API_KEY: UNUSED
          REDDIT_CLIENT_ID: UNUSED
          REDDIT_CLIENT_SECRET: UNUSED
        run: python main.py --update-stats --no-competitors

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GNEWS_API_KEY: PLACEHOLDER
          REDDIT_CLIENT_ID: PLACEHOLDER
          REDDIT_CLIENT_SECRET: PLACEHOLDER
          TTS_PROVIDER: voicevox
          FFMPEG_PATH: ffmpeg
        run: |
          # ランナーが謎の強制終了をするケースの原因調査用に、メモリ/ディスク使用量を
          # 15秒おきにライブログへ流す（強制終了直前の状態を後から確認できるようにする）
          ( while true; do
              echo "[monitor] $(date -u +%H:%M:%S) $(free -m | awk '/^Mem:/{print "mem="$3"MB/"$2"MB"}') disk_avail=$(df -h --output=avail / | tail -1 | tr -d ' ')"
              echo "[monitor-ps] $(ps -eo pid,ppid,rss,comm --sort=-rss | head -8 | tr '\n' '|')"
              sleep 15
            done ) &
          MONITOR_PID=$!
          set +e
          python main.py --once
          EXIT_CODE=$?
          set -e
          kill "$MONITOR_PID" 2>/dev/null || true
          exit $EXIT_CODE

      # google-auth がアクセストークンを更新した場合に Secret を上書き
      - name: Refresh YouTube token secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f config/credentials/token.json ]; then
            gh secret set YOUTUBE_TOKEN < config/credentials/token.json
          fi
