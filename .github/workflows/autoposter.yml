name: YouTube Auto Poster

on:
  schedule:
    - cron: '0 22 * * *'  # 07:00 JST
    - cron: '0 10 * * *'  # 19:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credentials
        run: |
          mkdir -p config/credentials
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > config/credentials/client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN }}' > config/credentials/token.json

      - name: Run pipeline
        run: python main.py --once
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TTS_PROVIDER: edge_tts
          FFMPEG_PATH: ffmpeg

      - name: Save seen items
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_items.json
          git diff --cached --quiet || (git commit -m "chore: update seen items [skip ci]" && git pull --rebase && git push)
